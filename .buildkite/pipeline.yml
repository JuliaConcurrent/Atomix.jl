steps:
  - label: "CUDA.jl {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(PackageSpec(name="Atomix", path="."))
                Pkg.add("CUDACore")

                println("+++ :julia: Running tests")
                Pkg.test("Atomix", test_args=["--CUDA"])'
    agents:
      queue: "cuda"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 15

  - label: "oneAPI.jl {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(PackageSpec(name="Atomix", path="."))
                Pkg.add(url="https://github.com/JuliaGPU/oneAPI.jl", rev="main")

                println("+++ :julia: Running tests")
                Pkg.test("Atomix", test_args=["--oneAPI"])'
    agents:
      queue: "oneapi"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 15

  - label: "OpenCL.jl {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(PackageSpec(name="Atomix", path="."))
                Pkg.add([PackageSpec(url="https://github.com/JuliaGPU/OpenCL.jl", rev="main"),
                         PackageSpec(name="pocl_jll")])

                println("+++ :julia: Running tests")
                Pkg.test("Atomix", test_args=["--OpenCL"])'
    agents:
      queue: "oneapi"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 15

  - label: "Metal.jl {{matrix.version}}"
    matrix:
      setup:
        version:
          - "1.10"
          - "1.12"
    plugins:
      - JuliaCI/julia#v1:
          version: "{{matrix.version}}"
    command: |
      julia -e 'using Pkg

                println("--- :julia: Instantiating environment")
                Pkg.develop(PackageSpec(name="Atomix", path="."))
                Pkg.add("Metal")

                println("+++ :julia: Running tests")
                Pkg.test("Atomix", test_args=["--Metal"])'
    agents:
      queue: "metal"
    if: build.message !~ /\[skip tests\]/
    timeout_in_minutes: 15

env:
  JULIA_PKG_PRECOMPILE_AUTO: false
